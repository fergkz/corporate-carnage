services:
  game:
    build:
      context: .
    ports:
      - "${HOST_PORT:-8080}:${GAME_PORT:-8080}"
    environment:
      PORT: ${GAME_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://game:${GAME_PORT:-8080}
    depends_on:
      game:
        condition: service_healthy
